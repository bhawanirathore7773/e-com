{% extends 'base.html' %}
{% block title %}Contact | CorporateSite{% endblock %}
{% block content %}
<section class="py-5">
    <div class="container">
        <h1 class="mb-4">Contact Us</h1>
        <div class="row">
            <div class="col-lg-8">
                <form method="post" novalidate>
                    {% csrf_token %}
                    <div class="row g-3">
                        {% for field in form %}
                            <div class="col-12 {% if field.name != 'message' %}col-md-6{% endif %}">
                                <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                                {{ field }}
                                {% if field.errors %}
                                    <div class="text-danger small">{{ field.errors|striptags }}</div>
                                {% endif %}
                            </div>
                        {% endfor %}
                    </div>
                    <button type="submit" class="btn btn-primary mt-4">Send Inquiry</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
